name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Criar pacote zip
        run: zip meu-crud-${{ github.ref_name }}.zip index.html CHANGELOG.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: meu-crud-${{ github.ref_name }}.zip
          generate_release_notes: true